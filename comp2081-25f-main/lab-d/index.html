<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Lab D | 2D CSS Transforms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            background-repeat: no-repeat;
        }
        p {
            height: 100px;
            width: 100px;
            margin: 1rem;
            color: white;
            font-weight: bold;
            text-align: center;
            line-height: 100px;
            display: inline-block;
            transition: transform 0.4s ease;
        }
        p#rotate {
            background-color: orange;
            transform-origin: 50% 50%;
            transform: rotate(30deg);
        }
        p#rotate:hover {
            transform: rotate(-30deg);
        }
        p#scale {
            background-color: purple;
            transform-origin: 0% 100%;
            transform: scale(1.5, 1.1);
        }
        p#scale:hover {
            transform: scale(0.8, 1.4);
        }
        p#skew {
            background-color: limegreen;
            transform-origin: right center;
            transform: skew(-20deg, 15deg);
        }
        p#skew:hover {
            transform: skew(20deg, -10deg);
        }
        p#translate {
            background-color: hotpink;
            transform: translate(60px, -20px);
        }
        p#translate:hover {
            transform: translate(-40px, 30px);
        }
        p#combo {
            background-color: darkred;
            transform: scale(1.2) rotate(15deg) translate(10px, -10px);
            animation: comboGlow 5s linear infinite;
        }
        p#combo:hover {
            transform: scale(0.9) rotate(-15deg) translate(-20px, 20px);
        }
        @keyframes comboGlow {
            0% {
                background-color: darkred;
            }
            25% {
                background-color: #a32020;
            }
            50% {
                background-color: #d43d3d;
            }
            75% {
                background-color: #8b1a1a;
            }
            100% {
                background-color: darkred;
            }
        }
    </style>
</head>
<body>
    <p id="rotate">Rotate me.</p>
    <p id="scale">Scale me.</p>
    <p id="skew">Skew me.</p>
    <p id="translate">Translate me.</p>
    <p id="combo">Transform me.</p>
</body>
</html>
